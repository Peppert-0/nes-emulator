name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable

    - run: sudo apt update && sudo apt install libsdl3-dev -y
    - run: cargo build --verbose
    - run: cargo test --verbose

